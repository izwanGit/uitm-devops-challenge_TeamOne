name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  # -----------------------------------------------------------------------------
  # 1. CodeQL (Advanced Security) - NEW
  # -----------------------------------------------------------------------------
  codeql-analysis:
    name: CodeQL Analysis (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # -----------------------------------------------------------------------------
  # 2. Granular SAST (Backend) - UPGRADED
  # -----------------------------------------------------------------------------
  backend-sast:
    name: Security Scan / Backend SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Secrets (Backend)
      - name: Backend Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      # Trivy (Backend FS)
      - name: Backend Vulnerability Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './rentverse-backend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

      # NPM Audit (Backend)
      - name: Backend Dependency Audit
        working-directory: ./rentverse-backend
        run: pnpm audit --prod --audit-level=high || true

  # -----------------------------------------------------------------------------
  # 3. Granular SAST (Frontend) - UPGRADED
  # -----------------------------------------------------------------------------
  frontend-sast:
    name: Security Scan / Frontend SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Trivy (Frontend FS)
      - name: Frontend Vulnerability Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './rentverse-frontend'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # -----------------------------------------------------------------------------
  # 4. Database Checks - NEW
  # -----------------------------------------------------------------------------
  db-migration-check:
    name: Deployment Checks / Database Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: 'pnpm', cache-dependency-path: './rentverse-backend/pnpm-lock.yaml' }
      
      - name: Install Dependencies
        working-directory: ./rentverse-backend
        run: pnpm install --frozen-lockfile
      
      - name: Validate Prisma Schema
        working-directory: ./rentverse-backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: pnpm prisma validate

  # -----------------------------------------------------------------------------
  # Backend CI (Lint/Build)
  # -----------------------------------------------------------------------------
  backend-ci:
    name: Deployment Checks / Backend Pre-Deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 18, cache: 'pnpm', cache-dependency-path: './rentverse-backend/pnpm-lock.yaml' }
        
      - name: Install Dependencies
        working-directory: ./rentverse-backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./rentverse-backend
        run: pnpm lint

  # -----------------------------------------------------------------------------
  # Frontend CI (Lint/Build)
  # -----------------------------------------------------------------------------
  frontend-ci:
    name: Deployment Checks / Frontend Pre-Deploy Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with: { bun-version: latest }
      
      - name: Install Dependencies
        working-directory: ./rentverse-frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./rentverse-frontend
        run: bun run lint

  # -----------------------------------------------------------------------------
  # AI Service CI
  # -----------------------------------------------------------------------------
  ai-service-ci:
    name: Security Scan / AI Service SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: snok/install-poetry@v1
        with: { virtualenvs-create: true, virtualenvs-in-project: true }
      - name: Install Dependencies
        working-directory: ./rentverse-ai-service
        run: poetry install --no-interaction
      - name: Run Tests
        working-directory: ./rentverse-ai-service
        env: { DATABASE_URL: postgresql://user:pass@localhost:5432/db }
        run: poetry run pytest

  # -----------------------------------------------------------------------------
  # CD Pipeline: Build & Push
  # -----------------------------------------------------------------------------
  build-and-push:
    name: Deployment Checks / Build & Push Docker Images
    needs: [codeql-analysis, backend-sast, frontend-sast, db-migration-check, backend-ci, frontend-ci, ai-service-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [rentverse-frontend, rentverse-backend, rentverse-ai-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set lowercase owner name
        id: string
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.string.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -----------------------------------------------------------------------------
  # Deployment Summary (Aggregated Status) - NEW
  # -----------------------------------------------------------------------------
  deployment-summary:
    name: Deployment Checks / Deployment Summary
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "🚀 RentVerse Deployment Pipeline Completed"
          echo "✅ CodeQL Analysis: Passed"
          echo "✅ Backend SAST: Passed"
          echo "✅ Frontend SAST: Passed"
          echo "✅ Database Checks: Passed"
          echo "✅ Docker Registry: ghcr.io updated"
