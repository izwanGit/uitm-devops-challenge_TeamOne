name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # -----------------------------------------------------------------------------
  # Security Scanning (DevSecOps)
  # -----------------------------------------------------------------------------
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret Scanning
      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      
      # Vulnerability Scanning
      - name: Vulnerability Scanning (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1' # Fail on detection
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'

  # -----------------------------------------------------------------------------
  # Frontend CI
  # -----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Build & Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install Dependencies
        working-directory: ./rentverse-frontend
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: ./rentverse-frontend
        run: bun run lint
      
      # Uncomment when tests are available
      # - name: Run Unit Tests
      #   working-directory: ./rentverse-frontend
      #   run: bun test

  # -----------------------------------------------------------------------------
  # Backend CI
  # -----------------------------------------------------------------------------
  backend-ci:
    name: Backend CI (Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v2
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'
          cache-dependency-path: './rentverse-backend/pnpm-lock.yaml'

      - name: Install Dependencies
        working-directory: ./rentverse-backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: ./rentverse-backend
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: pnpm db:generate

      - name: Lint
        working-directory: ./rentverse-backend
        run: pnpm lint

      # Uncomment when tests are available
      # - name: Run Unit Tests
      #   working-directory: ./rentverse-backend
      #   run: pnpm test

  # -----------------------------------------------------------------------------
  # AI Service CI
  # -----------------------------------------------------------------------------
  ai-service-ci:
    name: AI Service CI (Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install Dependencies
        working-directory: ./rentverse-ai-service
        run: poetry install --no-interaction

      - name: Run Tests
        working-directory: ./rentverse-ai-service
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
        run: poetry run pytest

  # -----------------------------------------------------------------------------
  # CD Pipeline: Build & Push
  # -----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    needs: [security-scan, frontend-ci, backend-ci, ai-service-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [rentverse-frontend, rentverse-backend, rentverse-ai-service]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set lowercase owner name
        id: string
        run: echo "owner=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ steps.string.outputs.owner }}/${{ matrix.service }}:latest
            ghcr.io/${{ steps.string.outputs.owner }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
